# tokolog-flet settings, at ~/.config/tokolog-flet/config.toml. The gear in the app opens
# this file; saving it applies the changes. Every setting is optional; the values shown
# are the defaults.

# Every profile is a [profiles.<name>] table with the same keys. [profiles.default]
# is the base: the app uses it until another profile is picked, and the others take
# whatever they leave out from it.

[profiles.default]
# Countdown start time in minutes (fractions allowed, e.g. 1.5).
default_minutes = 25
# Label logged when the label field is left empty. Unset, the mode is used.
# default_label = "journal"
# The only mode the profile allows: "countdown" or "stopwatch". The app switches to it
# and locks the mode switch. "any" allows both.
# mode = "any"

# Folder for the daily activity logs. "~" is expanded and relative
# paths are taken from this file's folder. Default: ~/.local/share/tokolog-flet/log
# folder = "~/.local/share/tokolog-flet/log"

# File name, including extension. {date} is replaced using date_format, {label}
# with the label typed in the app and {profile} with the profile's name.
# A name without {date} puts every day in one file.
# file = "{date}.log"
# YYYY, YY, MM and DD are replaced, e.g. "YYYYMMDD" -> 20261021.
# date_format = "YYYY-MM-DD"
# Time for {time} in line_format. HH (24-hour), hh (12-hour), mm, ss and AM
# (AM or PM) are replaced, e.g. "hh:mm AM" -> 02:05 PM.
# time_format = "HH:mm:ss"
# One line per event.
# Placeholders: {date} {time} {mode} {event} {elapsed} {elapsed_hours} {display} {label} {profile}
#               {timer_minutes} {timer_clock} {timer_remaining} {started} {since_start} {paused}
#   event:   start, pause, resume, stop or finish
#   elapsed: time run so far, pauses left out
#   elapsed_hours: elapsed as decimal hours, e.g. 1.5
#   display: what the timer showed (countdown: time left)
#   label:   the label typed in the app, else default_label, else the mode
#   profile: the profile picked in the app ("default" if none)
#   timer_minutes:   the countdown's length in minutes, e.g. 25 (blank for a stopwatch)
#   timer_clock:     the countdown's length in clock format, e.g. 25:00 (blank for a stopwatch)
#   timer_remaining: the countdown's time left (blank for a stopwatch)
#   started:     clock time the session started, in time_format
#   since_start: time since the start, pauses included
#   paused:      time spent paused (since_start minus elapsed)
# Python format specs work ({mode:<9} pads); use {{ and }} for literal braces.
# line_format = "{time}  {mode:<9}  {event:<6}  {elapsed}"

# Different lines for particular events or modes. Keys are an event (start, pause,
# resume, stop, finish), a mode (countdown, stopwatch) or both (countdown.stop); the
# most specific wins, and events without one use line_format. An empty line means the
# event isn't logged. A profile's own lines table replaces this one, and a profile that
# sets its own line_format takes no lines from here.
# [profiles.default.lines]
# start = "- {time} ▶ {label}"
# stop = "- {started}-{time} {label} ran {elapsed}, paused {paused}"
# countdown.start = "- {time} ▶ {label} ({timer_minutes}m)"
# countdown.finish = "- {started}-{time} ✓ {label} {timer_minutes}m done"
# pause = ""
# resume = ""

# More profiles, picked at the bottom of the window. Set only what differs from
# [profiles.default]. Some to start from; uncomment one whole block.

# Journal: a readable Markdown line for every event, and a summary when it ends.
# [profiles.journal]
# file = "{date}.md"
# time_format = "HH:mm"
# [profiles.journal.lines]
# start            = "- {time} ▶ **{label}**"
# pause            = "- {time} ⏸ **{label}** after {elapsed}"
# resume           = "- {time} ⏵ **{label}**, paused {paused} so far"
# stop             = "- {started}–{time} ■ **{label}**: {elapsed} worked, {paused} paused"
# countdown.start  = "- {time} ▶ **{label}** ({timer_minutes} min)"
# countdown.stop   = "- {started}–{time} ■ **{label}**: stopped, {timer_remaining} of {timer_minutes} min left"
# countdown.finish = "- {started}–{time} ✓ **{label}**: {timer_minutes} min done, {paused} paused"

# Summary: one line per session, written when it ends. An empty line_format skips
# every event that has no line of its own.
# [profiles.summary]
# file = "{date}.md"
# time_format = "HH:mm"
# line_format = ""
# [profiles.summary.lines]
# stop   = "- {started}–{time} {label} ({elapsed})"
# finish = "- {started}–{time} {label} ({elapsed}) ✓"

# Timesheet: one CSV row per session, all in one file, ready for a spreadsheet.
# [profiles.timesheet]
# folder = "~/work"
# file = "timesheet.csv"
# time_format = "HH:mm"
# line_format = ""
# [profiles.timesheet.lines]
# stop   = "{date},{started},{time},{label},{elapsed},{paused}"
# finish = "{date},{started},{time},{label},{elapsed},{paused}"

# Pomodoro: 25-minute focus blocks, timer only; pauses aren't logged.
# [profiles.pomodoro]
# mode = "countdown"
# default_minutes = 25
# default_label = "focus"
# time_format = "HH:mm"
# line_format = "- {time} {event} {label} {elapsed}"
# [profiles.pomodoro.lines]
# countdown.start  = "- {time} 🍅 {label}"
# countdown.finish = "- {time} 🍅 ✓ {label} ({timer_minutes} min)"
# countdown.stop   = "- {time} 🍅 ✗ {label}: gave up with {timer_remaining} left"
# pause  = ""
# resume = ""
